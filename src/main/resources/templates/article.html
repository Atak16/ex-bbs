<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="name">投稿者名：</label>
        <input type="text-area" name="name" id="name"><br>
        <label for="content">内容：</label>
        <textarea name="content" id="content"></textarea><br>
        <button type="submit">記事投稿</button>
    </form>
    <hr>
    <!-- articleListの記事を1件ずつ取得を繰り返す -->
    <div th:each="article : ${articleList}">
        投稿者名：<span th:text="${article.name}"></span><br>
        投稿内容：<br><strong th:text="${article.content}"></strong>
    </div>
</body>
</html>
